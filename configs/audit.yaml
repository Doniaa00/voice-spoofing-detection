# Stage 1 dataset audit — dataset pins, data roots and output dirs.
#
# Read only by notebooks/01_stage1_dataset_audit.ipynb. Per CLAUDE.md, no Colab/Drive path is
# hardcoded in code: the paths below are the Colab defaults; change them if your session differs.
# src/audit/*.py never reads this file; it takes root/out/revision from CLI args.

for2sec:
  root: "/content/data/for_2sec"          # local disk; the notebook downloads the dataset here
  out: "/content/audit_out/for2sec"
  revision: "ff8c82c79e7bbefef811941bac9775c9328e9055"   # pinned HF commit sha (UncovAI/FOR-2sec); required

deepvoice:
  root: "/content/data/deep_voice"        # local disk; the notebook unzips the Kaggle archive here
  audit_subdir: "KAGGLE"                  # metadata audit runs on <root>/<audit_subdir> only
  out: "/content/audit_out/deepvoice"
  revision: ""                            # unused: Kaggle shows no version number; pinned by zip_sha256
  zip_sha256: "8cb258530daa2bb678121f3b276313a4d56fc638280bfd276a610dd8f732bdcf"   # pinned Kaggle zip; required

drive:
  raw_root: "/content/drive/MyDrive/voice-spoofing-detection/raw"   # dataset backups (.tar, .zip, hashes)
  archive_root: "/content/drive/MyDrive/voice-spoofing-detection/processed/metadata/stage1"   # audit outputs
